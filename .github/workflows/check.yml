name: check
on:
  push:
    branches: [main]
    paths:
      - "analyze.py"
      - "sim/**"
      - "data/**"
      - "tools/check.py"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 계산 전체 점검 (작은 프로필 분석까지)
        run: python tools/check.py
        env:
          DOSA_URL: ${{ secrets.DOSA_URL }}
          DOSA_KEY: ${{ secrets.DOSA_KEY }}
