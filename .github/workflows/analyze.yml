name: analyze
on:
  schedule:
    - cron: "0 0,12 * * *"   # 한국 시간 오전 9시, 밤 9시(예비)
  workflow_dispatch:
concurrency:
  group: analyze
  cancel-in-progress: false
env:
  DOSA_URL: ${{ secrets.DOSA_URL }}
  DOSA_KEY: ${{ secrets.DOSA_KEY }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ids: ${{ steps.p.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 계산 빠른 점검 (실패하면 분석하지 않음, 전체 점검은 check.yml이 push 때 실행)
        run: python tools/check.py --quick
      - name: 대기 중인 프로필 목록 (실행 기록에는 닉네임 대신 해시)
        id: p
        run: python analyze.py --plan >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    if: ${{ needs.plan.outputs.ids != '[]' && needs.plan.outputs.ids != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 프로필 하나 계산
        run: python analyze.py --one ${{ matrix.id }}
