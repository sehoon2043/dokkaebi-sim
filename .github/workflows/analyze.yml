name: analyze
on:
  schedule:
    - cron: "0 0,12 * * *"   # 한국 시간 오전 9시, 밤 9시
  workflow_dispatch:
concurrency:
  group: analyze
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 대기 중인 프로필 분석
        run: python analyze.py
        env:
          DOSA_URL: ${{ secrets.DOSA_URL }}
          DOSA_KEY: ${{ secrets.DOSA_KEY }}
